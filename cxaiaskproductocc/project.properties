# you can put key/value pairs here.
# Use Config.getParameter(..) to retrieve the values during runtime.

cxaiaskproductocc.key=value

# Specifies the location of the spring context file added automatically to the global platform application context.
cxaiaskproductocc.application-context=cxaiaskproductocc-spring.xml

#Use for generating static swagger documentation
cxaiaskproductocc.documentation.static.generate=true
ext.cxaiaskproductocc.extension.webmodule.webroot=/occ/v2
corsfilter.cxaiaskproductocc.allowedOrigins=*

log4j2.logger.AskProductPayloadLoggingInterceptor.name=com.sap.cxaiaskproductocc.logging.PayloadLoggingInterceptor
log4j2.logger.AskProductPayloadLoggingInterceptor.level=info

cxai.ask-product.api.path=/products/v1/about/ask
cxai-assistant.api.path=/shopping-assistant/api/v1
cxai.long-response-warning-threshold-ms=45000

cxai.anonymous.api.access.enabled=false

# proxy connection pool properties
# cxai.httpclient.read-timeout-ms=180000
