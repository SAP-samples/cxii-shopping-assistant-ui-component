<div  class="cxai-chat-wrapper" *ngIf="productCode$ | async as productCode">
  <div class="chat cxai-chat" #chat>
    <div *ngIf="!messages?.length" class="message assistant">
      <div class="message-content">{{ 'askProduct.welcomeMessage' | cxTranslate }}</div>
    </div>

    <div
      class="message {{ message.source }} {{ message.status || '' }}"
      *ngFor="let message of messages; trackBy: trackByIndex"
    >
      <div class="message-content">{{ message.message || ('askProduct.noAnswerMessage' | cxTranslate) }}</div>
      <div class="sources" *ngIf="message.sources?.length">
        <div class="source" *ngFor="let source of message.sources">
          <cx-icon [cxIcon]="icon.FILE"></cx-icon>
          <a *ngIf="source.downloadUrl" [href]="source.downloadUrl" target="_blank">{{ source.name }}</a>
          <span *ngIf="!source.downloadUrl">{{ source.name }}</span>
        </div>
      </div>
    </div>
    <div *ngIf="busy" class="message assistant waiting">
      <div class="message-content">
        <div class="dot-loader"></div>
      </div>
    </div>
  </div>
  <form class="cxai-chat-form">
    <textarea
      #chatInputField
      maxlength="1000"
      [readonly]="busy"
      (keypress)="onKeyPress($event, productCode)"
      (input)="onMessageInput($event)"
      [value]="message"
      class="form-control cxai-chat-input"
      name="message"
      placeholder="{{ 'askProduct.inputPlaceholder' | cxTranslate }}"
    ></textarea>
    <div class="buttons messages-{{!!messages?.length}} valid-{{isMessageValid}}">
      <button type="button" class="btn cxai-btn-clear btn-secondary" [disabled]="busy || !messages?.length" (click)="clearConversation(productCode)">
        {{ 'askProduct.clearChat' | cxTranslate }}
      </button>
      <button type="submit" class="btn cxai-btn-send btn-primary" [disabled]="busy || !isMessageValid" (click)="sendMessage(productCode)">
        <ng-container *ngTemplateOutlet="aiIcon"></ng-container>
        {{ 'askProduct.send' | cxTranslate }}
      </button>
    </div>
  </form>
</div>

<ng-template #aiIcon>
  <div class="ai-icon">
