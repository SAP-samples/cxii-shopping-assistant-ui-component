<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>web-component</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <style type="text/css">
      cxai-ask-product-chat > * {
        --cx-color-light: lime;
      }
    </style>
  </head>
  <body>
    <script>
      window['ACC'] = {
        spartacus:{
          occEndpoints: {
            cxaiAssistant_postMessage: '/cxai/assistant/chat',
            cxaiAssistant_getChatSession: '/cxai/assistant/chat_session/${sessionId}',
            cxaiAssistant_createChatSession: '/cxai/assistant/chat_session',
            cxaiAssistant_deleteChatSession: '/cxai/assistant/sessions',
            product: 'products/${productCode}?fields=DEFAULT,averageRating,images(FULL),classifications,manufacturer,numberOfReviews,categories(FULL),baseOptions,baseProduct,variantOptions,variantType',
          },
        },
        cxaiassistant: {
          imageFormats: ['thumbnail', 'product', 'zoom'],
        },
      };
    </script>
    <cxai-ask-product-chat
      base-url="https://api.{url}/occ/v2/"
      product-code="BR3026"
      site="electronics-spa"
      site-name="Electronics Store"
    ></cxai-ask-product-chat>

    <cxai-assistant-chat
      base-url="https://api.{url}/occ/v2/"
      media-base-url="https://api.{url}/"
      site="electronics-spa"
    ></cxai-assistant-chat>
  </body>
</html>
