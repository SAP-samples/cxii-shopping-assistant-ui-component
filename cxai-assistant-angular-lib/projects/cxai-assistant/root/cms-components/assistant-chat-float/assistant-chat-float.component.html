<div [class.chat-opened]="chatOpened$ | async" class="cxai-chat-wrapper">

  <span class="chat-btn-wrapper" (click)="openChat()">
    <ng-content select="[slot=chat-button]">
      <button class="chat-btn">
        @if (!useSapIcons) {
          <i class="fa-regular fa-message"></i>
        }
        @if (useSapIcons) {
          <i class="sap-icon post"></i>
        }
      </button>
    </ng-content>
  </span>

  <ng-content select="[slot=main-component]"></ng-content>
</div>
