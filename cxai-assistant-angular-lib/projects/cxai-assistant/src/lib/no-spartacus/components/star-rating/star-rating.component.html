<div
  role="img"
  [title]="
    'productReview.ratedOutOf' | cxTranslate: { rating: rating.toFixed(1) }
  "
  [attr.aria-label]="
    'productReview.ratedOutOf' | cxTranslate: { rating: rating.toFixed(1) }
  "
  >
  <ng-container *ngTemplateOutlet="starRating"></ng-container>
</div>

<ng-template #starRating>
  @for (i of [1, 2, 3, 4, 5]; track i) {
    <i class="fas fa-star"
      class="star"
    ></i>
  }
</ng-template>
